name: Secrets

# Scans the commits of every PR into dev for leaked secrets.
# Uses the gitleaks CLI directly (pinned version + sha256), so no
# gitleaks-action licence is involved.

on:
    pull_request:
        branches: [dev]

permissions:
    contents: read

concurrency:
    group: gitleaks-${{ github.ref }}
    cancel-in-progress: true

env:
    GITLEAKS_VERSION: 8.30.1
    GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
    gitleaks:
        name: gitleaks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install gitleaks
              run: |
                  tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
                  echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
                  tar -xzf "${tarball}" gitleaks
                  ./gitleaks version

            - name: Scan PR commits
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: ./gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .
