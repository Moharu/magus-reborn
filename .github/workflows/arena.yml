name: Arena

# The AI-vs-AI tournament (#103) on the real engine, run for free on this public repo: sharded across jobs, capped in
# time, with the raw results and the Markdown report uploaded as artifacts and shown in the run's summary.
# The only trigger is a manual dispatch. It uses no secrets and writes nothing back (no commits, no wiki): publishing a
# report to the wiki is a separate, manual step.

on:
    workflow_dispatch:
        inputs:
            seed:
                description: Master seed (integer)
                type: string
                default: '1'
            top:
                description: Top N distinct Fire sets (each plays all 6 general pairs)
                type: string
                default: '8'
            games:
                description: Games per pair (even)
                type: string
                default: '2'
            generations:
                description: Self-tuning generations (0 = no tuning)
                type: string
                default: '0'

permissions:
    contents: read

env:
    # Shards stop themselves at this budget (a partial result is still merged and marked), well before the job timeout.
    SHARD_COUNT: 4
    TIME_BUDGET_SECONDS: 1200

# Paths: `npm run arena` runs the script from packages/arena (npm workspaces). The files the workflow reads and uploads are
# therefore always given to the CLI as absolute paths under $GITHUB_WORKSPACE/arena-out (shards, merged result, report,
# tuning); the artifact steps use the same files relative to the workspace root.

jobs:
    # Checks the inputs before any runner does real work, and decides whether the tune job runs.
    plan:
        name: plan
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            tune: ${{ steps.check.outputs.tune }}
        steps:
            - id: check
              env:
                  ARENA_SEED: ${{ inputs.seed }}
                  ARENA_TOP: ${{ inputs.top }}
                  ARENA_GAMES: ${{ inputs.games }}
                  ARENA_GENERATIONS: ${{ inputs.generations }}
              run: |
                  for name in ARENA_SEED ARENA_TOP ARENA_GAMES ARENA_GENERATIONS; do
                      if [[ ! "${!name}" =~ ^[0-9]{1,10}$ ]]; then
                          echo "::error::$name must be a non-negative integer, got '${!name}'"
                          exit 1
                      fi
                  done
                  # 10# so '00' and '007' are read as decimal numbers
                  if ((10#$ARENA_GENERATIONS > 0)); then echo "tune=true" >> "$GITHUB_OUTPUT"; else echo "tune=false" >> "$GITHUB_OUTPUT"; fi

    shard:
        name: shard ${{ matrix.shard }}
        needs: plan
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3]
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # Inputs go through env, never into the script text. The CLI rejects anything that is not an integer.
            - name: Play this shard
              env:
                  ARENA_SEED: ${{ inputs.seed }}
                  ARENA_TOP: ${{ inputs.top }}
                  ARENA_GAMES: ${{ inputs.games }}
                  ARENA_SHARD: ${{ matrix.shard }}
              run: |
                  mkdir -p "$GITHUB_WORKSPACE/arena-out"
                  npm run arena -- \
                      --seed "$ARENA_SEED" --top "$ARENA_TOP" --games "$ARENA_GAMES" \
                      --jobs 4 --time-budget "$TIME_BUDGET_SECONDS" \
                      --shard "$ARENA_SHARD/$SHARD_COUNT" --out "$GITHUB_WORKSPACE/arena-out/arena-shard-$ARENA_SHARD.json"
            - uses: actions/upload-artifact@v7
              with:
                  name: arena-shard-${{ matrix.shard }}
                  path: arena-out/arena-shard-${{ matrix.shard }}.json
                  retention-days: 14
                  if-no-files-found: error

    # Runs when some shards failed too: it merges the ones that uploaded, and the report is marked PARTIAL, naming the
    # missing shards. (It does not run when the inputs were rejected or the run was cancelled.) After the merge it plays
    # the top-8 double-elimination bracket (#136, best-of-5 sets, a few dozen games), recorded in the result JSON and the
    # report's Bracket section.
    merge:
        name: merge
        needs: [plan, shard]
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/download-artifact@v8
              with:
                  pattern: arena-shard-*
                  path: arena-in
                  merge-multiple: true
            - name: Merge the shards, play the top-8 bracket, write one result and one report
              run: |
                  mkdir -p "$GITHUB_WORKSPACE/arena-out"
                  npm run arena -- merge "$GITHUB_WORKSPACE"/arena-in/arena-shard-*.json --allow-missing \
                      --bracket-best-of 5 \
                      --out "$GITHUB_WORKSPACE/arena-out/arena-result.json" \
                      --report "$GITHUB_WORKSPACE/arena-out/arena-report.md" --commit "$GITHUB_SHA" > /dev/null
                  cat arena-out/arena-report.md >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@v7
              with:
                  name: arena-report
                  path: |
                      arena-out/arena-report.md
                      arena-out/arena-result.json
                  retention-days: 30
                  if-no-files-found: error

    # Optional self-tuning (#104). Runs alone in one process, on the same seed and loadouts as the tournament.
    tune:
        name: tune
        needs: plan
        if: ${{ needs.plan.outputs.tune == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Tune
              env:
                  ARENA_SEED: ${{ inputs.seed }}
                  ARENA_TOP: ${{ inputs.top }}
                  ARENA_GAMES: ${{ inputs.games }}
                  ARENA_GENERATIONS: ${{ inputs.generations }}
              run: |
                  mkdir -p "$GITHUB_WORKSPACE/arena-out"
                  npm run arena:tune -- \
                      --seed "$ARENA_SEED" --top "$ARENA_TOP" --games "$ARENA_GAMES" \
                      --generations "$((10#$ARENA_GENERATIONS))" --max-matches 1500000 \
                      --out "$GITHUB_WORKSPACE/arena-out/arena-tuned-profile.json" > arena-out/arena-tuning.txt
                  {
                      echo '## Arena self-tuning'
                      echo
                      echo '```'
                      cat arena-out/arena-tuning.txt
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@v7
              with:
                  name: arena-tuning
                  path: |
                      arena-out/arena-tuning.txt
                      arena-out/arena-tuned-profile.json
                  retention-days: 30
                  if-no-files-found: error
